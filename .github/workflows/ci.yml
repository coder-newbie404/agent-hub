name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/manager
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/manager/requirements.lock
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest tests/ -q

  local-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/local-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/local-adapter/requirements.lock
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest tests/ -q

  discord:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/discord
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/discord/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/template
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/template/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
