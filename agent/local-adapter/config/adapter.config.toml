# Adapter component-only tuning (safe to commit).
# Secrets and per-instance values (RUNTIME, AGENT_ID, MODEL, POLICY, tokens)
# live in env (.env or the systemd EnvironmentFile), never here.
# ADAPTER_CONFIG overrides this path.
#
# Precedence, highest first: process environment > this file > `.env` > code
# defaults. A key set here therefore beats the same key in `.env`: keep
# instance-specific keys out of this file.

# omp's own session-title store (read-only). Only applies to RUNTIME=omp.
# Titles found here are mirrored to the hub so /session list shows local
# names. Missing DB is a silent no-op.
omp_titles_db = "~/.omp/agent/history.db"

# Connection and sync cadence (seconds).
heartbeat_interval = 30
reconnect_max = 30
sync_interval = 60
sync_batch = 200

# Max size of one runtime output line (64 MiB). Raise it if single events
# exceed this (avoids "Separator is found, but chunk is longer than limit"
# run failures).
stream_limit_bytes = 67108864

# Agent-to-agent delegation drop box (see README). Set false to disable.
delegation_enabled = true
