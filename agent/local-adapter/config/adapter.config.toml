# omp-adapter component-only settings (safe to commit).
# Secrets and deployment-critical values live in env (.env), never here.
# ADAPTER_CONFIG overrides this path; env vars still win.

# Identity registered with the hub and shown by /agent status.
agent_id = "omp-local"
agent_name = "OMP Local"

# Local omp binary. Not set here on purpose: the default "omp" is resolved
# on PATH, and a value set here would override OMP_BIN from the process env
# or `.env`. Prefer `OMP_BIN=/absolute/path/to/omp` in the adapter `.env`
# (required under systemd, whose service PATH usually lacks ~/.local/bin).
# Setting it in this file also works, as an optional example:
# omp_bin = "/absolute/path/to/omp"

# omp's own session-title store (read-only). Titles found here are
# mirrored to the hub so /session list shows local names. Missing DB is a
# silent no-op.
omp_titles_db = "~/.omp/agent/history.db"

# Local persistence.
journal_dir = "~/.omp-adapter/journal"
state_file = "~/.omp-adapter/state.json"

# Connection and sync cadence (seconds).
heartbeat_interval = 30
reconnect_max = 30
sync_interval = 60
sync_batch = 200

# Max size of one `omp --mode=json` event line (64 MiB). Raise it if
# single events exceed this (avoids "Separator is found, but chunk is
# longer than limit" run failures).
stream_limit_bytes = 67108864
